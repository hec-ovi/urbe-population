<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>simulation testbed</title>
  <style>
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #14161a; color: #e6e6e6; display: flex; }
    #left { flex: 1; padding: 10px; }
    #panel { width: 340px; padding: 10px; background: #1c1f24; border-left: 1px solid #333; height: 100vh; overflow-y: auto; box-sizing: border-box; }
    canvas { background: #0e1013; border: 1px solid #333; display: block; width: 100%; }
    #controls { margin: 8px 0; display: flex; gap: 8px; align-items: center; }
    input[type=range] { flex: 1; }
    button { background: #2a2e35; color: #e6e6e6; border: 1px solid #444; padding: 4px 10px; cursor: pointer; }
    h3 { margin: 8px 0 4px; font-size: 13px; }
    .kv { color: #9ab; }
    #legend span { display: inline-block; margin-right: 10px; }
    #legend i { display: inline-block; width: 10px; height: 10px; margin-right: 3px; }
    pre { white-space: pre-wrap; color: #cdd6e0; }
  </style>
</head>
<body>
  <div id="left">
    <div id="controls">
      <button id="play">play</button>
      <input id="time" type="range" min="0" max="10079" value="540" step="1" />
      <span id="clock"></span>
    </div>
    <canvas id="map" width="1000" height="500"></canvas>
    <div id="legend"></div>
    <p>Click a walking dot to instantiate that NPC. Click a workplace to meet whoever is on duty.</p>
  </div>
  <div id="panel"><h3>NPC</h3><pre id="npc">nobody yet</pre><h3>Now</h3><pre id="now"></pre></div>
  <script type="module" src="./dist/testbed/main.js"></script>
</body>
</html>
